<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }

    #fx4-branco { position: absolute; inset: 0; background: #ffffff; opacity: 0; }

  </style>
  <div id="root" data-composition-id="fx" data-width="1920" data-height="1080">

      <div id="fx4-branco"></div>
      <div id="fx4-preto"></div>
    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var A = window.Almoco;
      var $ = function (id) { return document.getElementById(id); };

      [1.98, 6.36, 8.28, 11.32, 13.16, 14.92, 16.92, 18.68, 19.28, 19.88, 20.48, 21.08, 22.76, 25.96, 28.44, 32.12].forEach(function (t) {

      });
      // flashes brancos nos "medo"
      [6.45, 21.98].forEach(function (t) { A.flash(tl, $('fx4-branco'), t, { pico: 0.6, dur: 0.14 }); });

      tl.set($('fx4-preto'), { opacity: 1 }, 21.8);

      window.__timelines['fx'] = tl;
    })();
