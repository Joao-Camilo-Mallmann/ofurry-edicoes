  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var A = window.Almoco;
      var $ = function (id) { return document.getElementById(id); };
      // cantos da tela da TV na imagem A15 (1920x1080): TL, TR, BR, BL
      var QUAD = [[607, 258], [1233, 255], [1228, 765], [609, 760]];
      var W = 800, H = 600;
      function adj(m) { return [m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4], m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5], m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3]]; }
      function mul(a, b) { var c = []; for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) { var s = 0; for (var k = 0; k < 3; k++) s += a[3*i+k] * b[3*k+j]; c[3*i+j] = s; } return c; }
      function mulv(m, v) { return [m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]; }
      function basis(p) { var m = [p[0][0], p[1][0], p[2][0], p[0][1], p[1][1], p[2][1], 1, 1, 1]; var v = mulv(adj(m), [p[3][0], p[3][1], 1]); return mul(m, [v[0], 0, 0, 0, v[1], 0, 0, 0, v[2]]); }
      function homografia(src, dst) { var t = mul(basis(dst), adj(basis(src))); for (var i = 0; i < 9; i++) t[i] /= t[8]; return 'matrix3d(' + [t[0], t[3], 0, t[6], t[1], t[4], 0, t[7], 0, 0, 1, 0, t[2], t[5], 0, t[8]].join(',') + ')'; }
      $('tv7-tela').style.transform = homografia([[0, 0], [W, 0], [W, H], [0, H]], QUAD);

      A.photo($('tv7-foto'), { src: 'assets/img/A15-sala-tv-anos-70.png', depth: 'assets/depth/A15-sala-tv-anos-70-depth.png', strength: 0 })

          tl.to($('tv7-cena'), { opacity: 0, duration: 0.3 }, 24.0);
          tl.set({}, {}, 70.5);
          window.__timelines['tv'] = tl;
