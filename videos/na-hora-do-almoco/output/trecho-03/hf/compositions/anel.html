<template>
  <style>
    @font-face { font-family: 'Bebas Neue'; src: url('assets/fonts/BebasNeue-Regular.otf') format('opentype'); font-weight: 400; font-display: block; }
    @font-face { font-family: 'MontserratLocal'; src: url('assets/fonts/Montserrat-Regular.otf') format('opentype'); font-weight: 400; font-display: block; }
    @font-face { font-family: 'MontserratLocal'; src: url('assets/fonts/Montserrat-Medium.otf') format('opentype'); font-weight: 500; font-display: block; }
    @font-face { font-family: 'MontserratLocal'; src: url('assets/fonts/Montserrat-SemiBold.otf') format('opentype'); font-weight: 600; font-display: block; }
    @font-face { font-family: 'MontserratLocal'; src: url('assets/fonts/Montserrat-Bold.otf') format('opentype'); font-weight: 700; font-display: block; }
    @font-face { font-family: 'MontserratLocal'; src: url('assets/fonts/Montserrat-ExtraBold.otf') format('opentype'); font-weight: 800; font-display: block; }

    #root { position: absolute; inset: 0; }

    #root .an-svg { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; overflow: visible; }
    #root .an-centro { position: absolute; left: 0; right: 0; top: 0; height: 1080px; display: flex; align-items: center; justify-content: center; pointer-events: none; }

    #root .an-big { position: absolute; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 150px; }
  </style>
  <div data-hf-id="hf-hx2x" id="root" data-composition-id="anel" data-width="1920" data-height="1080">
    <!-- cena 1 (fundo creme): a mesa vista de cima, 4 pratos = 4 acordes; em "looping" ela deita e vira disco -->
    <div data-hf-id="hf-6cow" id="an1" class="clip an-cena" data-start="6.8" data-duration="11.4" data-track-index="0" data-layout-allow-overflow>
      <div data-hf-id="hf-ub23" id="an1-gira" class="an-gira">
        <svg data-hf-id="hf-nli5" id="an1-svg" class="an-svg" viewBox="0 0 1000 1000"></svg>
        <svg data-hf-id="hf-4yfc" id="an1-braco" class="an-svg" viewBox="0 0 1000 1000"></svg>
      </div>
      <div data-hf-id="hf-hus5" class="an-centro"><div data-hf-id="hf-hz85" id="an1-tom" class="an-rot" style="color:#2b2118">LÁ<br data-hf-id="hf-x5px" />MAIOR</div></div>
      <div data-hf-id="hf-j4ee" class="an-topo"><div data-hf-id="hf-4rcj" id="an1-loop" class="an-big" style="color:#2b2118">looping</div></div>
    </div>
    <!-- cena 2 (fundo escuro): o mesmo disco-mesa girando cada vez mais rapido; um prato tenta se soltar -->
    <div data-hf-id="hf-74g0" id="an2" class="clip an-cena" data-start="37.6" data-duration="11.2" data-track-index="1" data-layout-allow-overflow>
      <div data-hf-id="hf-2aou" id="an2-gira" class="an-gira">
        <svg data-hf-id="hf-ie8a" id="an2-svg" class="an-svg" viewBox="0 0 1000 1000"></svg>
        <svg data-hf-id="hf-7kir" id="an2-braco" class="an-svg" viewBox="0 0 1000 1000"></svg>
      </div>
      <div data-hf-id="hf-v3t6" class="an-topo"><div data-hf-id="hf-9olu" id="an2-ang" class="an-big" style="color:#ede8de">angústia</div></div>
      <div data-hf-id="hf-vi47" class="an-topo"><div data-hf-id="hf-l014" id="an2-romper" class="an-big" style="color:#f2c230">romper</div></div>
    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var $ = function (id) { return document.getElementById(id); };
      var NS = 'http://www.w3.org/2000/svg';
      var ACORDES = ['A9', 'A9/G', 'D9/F#', 'Dm/F'];
      var C = 500, RM = 340, RP = 215, RPRATO = 92;       // centro, raio da mesa, raio do circulo de pratos, raio do prato
      var AMARELO = '#f2c230', CREME = '#ede8de', TINTA = '#2b2118';
      var AGULHA = 1.22;                                   // angulo (rad, horario a partir do topo) onde a agulha pousa
      var PIVO = [930, 90], CABECA = [702, 426];
      function el(tag, at, pai) { var e = document.createElementNS(NS, tag); for (var k in at) e.setAttribute(k, at[k]); pai.appendChild(e); return e; }
      // interpolacao por chaves [tempo, valor, ease ate a proxima]: funcao pura do tempo (vale para qualquer ordem de seek)
      function chave(t, ks) {
        if (t <= ks[0][0]) return ks[0][1];
        for (var i = 0; i < ks.length - 1; i++) {
          var a = ks[i], b = ks[i + 1];
          if (t <= b[0]) { var p = (t - a[0]) / Math.max(0.0001, b[0] - a[0]); return a[1] + (b[1] - a[1]) * gsap.parseEase(a[2] || 'none')(p); }
        }
        return ks[ks.length - 1][1];
      }
      // distancia angular (0..PI) entre dois angulos
      function dist(a, b) { return Math.abs((((a - b) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI); }

      // monta a mesa: tampo + sulcos e rotulo do disco (escondidos) + 4 pratos com talheres + ponto de luz; e o braco da vitrola
      function mesa(svg, braco, o) {
        var tampo = el('circle', { cx: C, cy: C, r: RM, fill: o.mesa, stroke: o.borda, 'stroke-width': 4 }, svg);
        var sulcos = el('g', { opacity: 0 }, svg);
        [326, 314, 302, 118, 106].forEach(function (r) { el('circle', { cx: C, cy: C, r: r, fill: 'none', stroke: CREME, 'stroke-width': 1.5, opacity: 0.3 }, sulcos); });
        var rotulo = el('g', {}, svg);
        el('circle', { cx: C, cy: C, r: 86, fill: AMARELO }, rotulo);
        el('circle', { cx: C, cy: C, r: 9, fill: '#15110d' }, rotulo);
        var elastico = el('line', { x1: C, y1: C - RP, x2: C, y2: C - RP, stroke: CREME, 'stroke-width': 3, 'stroke-dasharray': '10 10', opacity: 0 }, svg);
        var pratos = ACORDES.map(function (nome, i) {
          var a = i * Math.PI / 2, x = C + Math.sin(a) * RP, y = C - Math.cos(a) * RP;
          var fora = el('g', { transform: 'translate(' + x + ' ' + y + ')' }, svg);   // posicao (mexida a mao no "romper")
          var g = el('g', {}, fora);                                                  // animado pelo GSAP (entrada, pulso)
          var talher = el('g', { transform: 'rotate(' + (i * 90) + ')', fill: 'none', stroke: o.talher, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
          el('path', { d: 'M-128,-46 V-24 Q-128,-12 -118,-12 Q-108,-12 -108,-24 V-46 M-118,-46 V52' }, talher);
          el('path', { d: 'M118,-48 Q131,-20 118,6 V52' }, talher);
          el('circle', { cx: 0, cy: 0, r: RPRATO, fill: o.prato, stroke: TINTA, 'stroke-width': 3 }, g);
          var luz = el('circle', { cx: 0, cy: 0, r: RPRATO, fill: AMARELO, stroke: TINTA, 'stroke-width': 3, opacity: 0 }, g);
          el('circle', { cx: 0, cy: 0, r: 64, fill: 'none', stroke: TINTA, 'stroke-width': 1.5, opacity: 0.45 }, g);
          var t = el('text', { x: 0, y: 17, 'text-anchor': 'middle', 'font-family': 'MontserratLocal, sans-serif', 'font-size': nome.length > 3 ? 42 : 52, 'font-weight': 700, fill: TINTA }, g);
          t.textContent = nome;
          return { fora: fora, g: g, luz: luz, a: a, x: x, y: y };
        });
        var ponto = el('circle', { cx: C, cy: C - RP, r: 18, fill: AMARELO, stroke: TINTA, 'stroke-width': 3, opacity: 0 }, svg);
        // braco da vitrola (nao gira com o disco)
        var gb = el('g', {}, braco);
        el('line', { x1: PIVO[0], y1: PIVO[1], x2: CABECA[0], y2: CABECA[1], stroke: o.contorno, 'stroke-width': 18, 'stroke-linecap': 'round' }, gb);
        el('line', { x1: PIVO[0], y1: PIVO[1], x2: CABECA[0], y2: CABECA[1], stroke: o.braco, 'stroke-width': 9, 'stroke-linecap': 'round' }, gb);
        el('circle', { cx: PIVO[0], cy: PIVO[1], r: 36, fill: o.braco, stroke: o.contorno, 'stroke-width': 5 }, gb);
        el('rect', { x: CABECA[0] - 26, y: CABECA[1] - 16, width: 52, height: 32, rx: 5, fill: AMARELO, stroke: TINTA, 'stroke-width': 3, transform: 'rotate(-56 ' + CABECA[0] + ' ' + CABECA[1] + ')' }, gb);
        return { svg: svg, tampo: tampo, sulcos: sulcos, rotulo: rotulo, elastico: elastico, pratos: pratos, ponto: ponto, braco: gb };
      }
      // acende o prato mais perto de um angulo (rad) no referencial da tela; rot = giro do disco em graus
      function acende(M, alvo, rot, forca) {
        var maior = 0;
        M.pratos.forEach(function (p) {
          var k = Math.max(0, 1 - dist(p.a + rot * Math.PI / 180, alvo) / 0.55) * forca;
          p.luz.setAttribute('opacity', k.toFixed(3));
          if (k > maior) maior = k;
        });
        return maior;
      }
      // um "pintor" por cena: tudo o que depende do tempo sai de funcoes puras de t
      function pintor(de, ate, pinta) {
        var o = { p: 0 }, d = ate - de;
        tl.fromTo(o, { p: 0 }, { p: 1, duration: d, ease: 'none', onUpdate: function () { pinta(de + o.p * d); } }, de);
      }

      // ================= cena 1: "quatro acordes no tom de La maior... se repetem... nao se resolvem... looping" =================
      var M1 = mesa($('an1-svg'), $('an1-braco'), { mesa: '#d8c8a2', borda: TINTA, prato: '#f7f0df', talher: TINTA, braco: '#2b2118', contorno: '#ebe2cd' });
      gsap.set(M1.rotulo, { opacity: 0, scale: 0.2, transformOrigin: '50% 50%' });
      gsap.set(M1.braco, { opacity: 0, rotation: -28, svgOrigin: PIVO[0] + ' ' + PIVO[1] });
      // "estrutura harmonica": a mesa pousa
      tl.fromTo(M1.tampo, { opacity: 0, scale: 0.86, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, 7.0);
      // "quatro acordes": os pratos pousam um a um
      M1.pratos.forEach(function (p, i) { tl.fromTo(p.g, { opacity: 0, scale: 1.5, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.6)' }, 9.0 + i * 0.25); });
      // "no tom de La maior": no centro da mesa
      tl.fromTo($('an1-tom'), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 10.6);
      tl.to($('an1-tom'), { opacity: 0, duration: 0.3 }, 16.2);
      // a luz: 1 volta ("se repetem"), tenta escapar pela borda ("nao se resolvem"), volta ao A9, outra volta ("ponto de partida")
      var V = 2 * Math.PI;
      var ANG = [[11.6, 0, 'none'], [13.0, V + Math.PI / 4, 'none'], [13.6, V + Math.PI / 4, 'power3.in'], [14.0, V, 'none'], [14.2, V, 'power1.inOut'], [15.6, 2 * V]];
      var RAIO = [[13.0, RP, 'power2.out'], [13.35, 470, 'none'], [13.6, 470, 'power3.in'], [14.0, RP]];
      var ROT1 = function (t) { var x = t - 16.5; return x <= 0 ? 0 : x < 0.6 ? 200 * x * x : 72 + 240 * (x - 0.6); };  // o disco pega velocidade
      tl.fromTo(M1.ponto, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 11.4);
      tl.to(M1.ponto, { opacity: 0, duration: 0.3 }, 16.2);
      window.Almoco.treme(tl, $('an1-gira'), 13.3, 0.35, 12, 41);
      tl.fromTo(M1.pratos[0].g, { scale: 1 }, { scale: 1.12, duration: 0.16, yoyo: true, repeat: 1, ease: 'power2.out', transformOrigin: '50% 50%', immediateRender: false }, 15.75);
      pintor(6.8, 18.2, function (t) {
        var a = chave(t, ANG), r = chave(t, RAIO), rot = ROT1(t);
        M1.ponto.setAttribute('cx', C + Math.sin(a) * r); M1.ponto.setAttribute('cy', C - Math.cos(a) * r);
        gsap.set(M1.svg, { rotation: rot, transformOrigin: '50% 50%' });
        if (t < 16.5) {
          // a luz "entra" no prato: o ponto some enquanto o prato esta aceso, para nao cobrir o nome do acorde
          var k = acende(M1, a, 0, t < 11.5 ? 0 : Math.max(0, 1 - Math.abs(r - RP) / 120) * 0.95);
          var vis = Math.max(0, 1 - k * 1.6).toFixed(3);
          M1.ponto.setAttribute('fill-opacity', vis); M1.ponto.setAttribute('stroke-opacity', vis);
        } else acende(M1, AGULHA, rot, chave(t, [[17.1, 0, 'none'], [17.4, 0.95]]));
      });
      // "uma especie de looping": a mesa deita, escurece, ganha sulcos e rotulo; o braco pousa
      tl.fromTo($('an1-gira'), { rotationX: 0, rotationZ: 0 }, { rotationX: 58, rotationZ: -6, duration: 1.2, ease: 'power3.inOut' }, 16.4);
      tl.to(M1.tampo, { attr: { fill: '#15110d' }, duration: 0.6, ease: 'power2.inOut' }, 16.4);
      tl.to(M1.sulcos, { opacity: 1, duration: 0.6 }, 16.5);
      tl.to(M1.rotulo, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, 16.55);
      tl.to(M1.braco, { opacity: 1, duration: 0.3 }, 16.5);
      tl.to(M1.braco, { rotation: 0, duration: 0.7, ease: 'power2.inOut' }, 16.6);
      tl.fromTo($('an1-loop'), { opacity: 0, scale: 1.2, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' }, 16.6);
      tl.to($('an1-gira'), { opacity: 0, duration: 0.3 }, 17.9);

      // ================= cena 2: "angustia... desespero por tentar romper" =================
      var M2 = mesa($('an2-svg'), $('an2-braco'), { mesa: '#0b0907', borda: CREME, prato: '#f7f0df', talher: CREME, braco: CREME, contorno: '#15110d' });
      gsap.set(M2.sulcos, { opacity: 1 });
      gsap.set(M2.braco, { svgOrigin: PIVO[0] + ' ' + PIVO[1] });
      tl.fromTo($('an2-gira'), { rotationX: 52, rotationZ: -6, opacity: 0 }, { rotationX: 48, rotationZ: 4, opacity: 1, duration: 1.0, ease: 'power2.out' }, 37.6);
      // gira cada vez mais rapido no desespero; a agulha acende o prato que passa por ela
      var ROT2 = function (t) { var x = Math.max(0, t - 37.6); return 360 * (x < 5.7 ? x / 1.6 : 5.7 / 1.6 + (x - 5.7) / 0.7); };
      // "romper": o prato do A9 se solta para fora, preso por um fio, e e puxado de volta
      var SOLTA = [[45.2, 0, 'power3.out'], [45.8, 150, 'none'], [46.3, 150, 'expo.in'], [46.65, 0]];
      pintor(37.6, 48.8, function (t) {
        var rot = ROT2(t), off = chave(t, SOLTA), p = M2.pratos[0];
        gsap.set(M2.svg, { rotation: rot, transformOrigin: '50% 50%' });
        acende(M2, AGULHA, rot, off > 20 ? 0 : 0.95);
        p.fora.setAttribute('transform', 'translate(' + p.x + ' ' + (p.y - off) + ')');
        M2.elastico.setAttribute('y2', C - RP - off + RPRATO * (off > RPRATO ? 1 : off / RPRATO));
        M2.elastico.setAttribute('opacity', off > 4 ? 0.7 : 0);
      });
      tl.fromTo($('an2-ang'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 40.7);
      tl.to($('an2-ang'), { opacity: 0, duration: 0.3 }, 43.0);
      // tremedeira (sementeada) no "desespero"
      var rnd = window.Almoco.mulberry32(31);
      for (var i = 0; i < 14; i++) tl.to($('an2-gira'), { x: (rnd() - 0.5) * 22, y: (rnd() - 0.5) * 14, duration: 0.09, ease: 'none' }, 43.3 + i * 0.09);
      tl.fromTo($('an2-romper'), { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'expo.out' }, 45.5);
      tl.to($('an2-gira'), { x: 0, y: 0, duration: 0.2 }, 46.6);
      tl.to($('an2-romper'), { opacity: 0, filter: 'blur(12px)', duration: 0.3 }, 46.65);
      tl.to($('an2-gira'), { opacity: 0, duration: 0.4 }, 48.35);

      window.__timelines['anel'] = tl;
    })();
  </script>
