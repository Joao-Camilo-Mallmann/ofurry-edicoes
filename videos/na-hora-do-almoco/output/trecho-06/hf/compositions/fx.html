      <div id="fx6-branco"></div>
      <div id="fx6-preto"></div>

    (function () {

      [7.3, 9.1, 18.8, 32.17, 32.6, 33.0, 33.4, 33.9, 35.0, 39.3].forEach(function (t, i) {

      [2.24, 13.69, 15.69, 29.05, 42.97].forEach(function (t) { A.flash(tl, $('fx6-branco'), t, { pico: 0.6, dur: 0.18 }); });

      tl.fromTo($('fx6-preto'), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: 'power2.out' }, 0);

      window.__timelines['fx'] = tl;
